name: CI
on:
  push:
    branches:
      - '*'
      - '*/*'
      - '**'
      - '!master'
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: nrwl/nx-set-shas@v3
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint affected
        run: pnpm exec nx affected -t=lint --base=origin/master
      - name: Test affected
        run: pnpm exec nx affected -t=test --base=origin/master --configuration=ci
      - name: Build affected
        run: pnpm exec nx affected -t=build --base=origin/master
