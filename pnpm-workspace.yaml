packages:
  - apps/*
  - libs/*
  - examples/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
  unrs-resolver: true
# Overrides for pinned versions + security patches. pnpm 10+ reads these
# from here (not from package.json's `overrides` field).
overrides:
  '@babel/runtime': '7.29.2'
  '@types/node': '^20'
  # Pin React types to the v18 line (runtime react is pinned to 18.2.0 below).
  # Two independent reasons: (1) Radix's optional `@types/react` peer otherwise
  # resolves to v19 for any lib without React types in scope (e.g. backroad-ui),
  # and two @types/react copies in one program collapse forwardRef props to
  # `never` (RefAttributes<never>); (2) react-remove-scroll (via react-select)
  # has a wide peer whose v19 ReactNode/ReactPortal types break Docusaurus
  # components (BrowserOnly, Link).
  '@types/react': '18.2.14'
  '@types/react-dom': '18.2.6'
  cross-spawn: '^7.0.6'
  esbuild: '^0.25.0'
  mdast-util-to-hast: '13.2.1'
  postcss: '^8.5.10'
  react: '18.2.0'
  react-dom: '18.2.0'
  # Patch only v6 — Docusaurus internally depends on react-router v5.3.x,
  # forcing it to v6 broke the docs build with a wall of missing exports.
  'react-router@^6': '^6.30.4'
  socket.io-parser: '4.2.6'
  uuid: '^11.1.1'
  vite: '^6.0.0'
  vitest: '^4.1.8'
  ws: '^8.20.1'
