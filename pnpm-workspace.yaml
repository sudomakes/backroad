packages:
  - apps/*
  - libs/*
  - examples/*
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
  unrs-resolver: true
# Overrides for pinned versions + security patches. pnpm 10+ reads these
# from here (not from package.json's `overrides` field).
overrides:
  '@babel/runtime': '7.29.2'
  '@types/node': '^20'
  cross-spawn: '^7.0.6'
  esbuild: '^0.25.0'
  mdast-util-to-hast: '13.2.1'
  postcss: '^8.5.10'
  react: '18.2.0'
  react-dom: '18.2.0'
  react-router: '^6.30.4'
  socket.io-parser: '4.2.6'
  uuid: '^11.1.1'
  vite: '^6.0.0'
  vitest: '^4.1.8'
  ws: '^8.20.1'
